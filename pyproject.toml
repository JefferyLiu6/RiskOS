[project]
name = "riskos"
version = "0.1.0"
description = "Credit risk, expected-credit-loss, and model governance platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "numpy>=1.26",
    "scipy>=1.14",
    "optbinning>=0.19",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "shap>=0.46",
    # Not a new capability — a resolver floor. shap pulls numba unconstrained,
    # and older numba pins llvmlite 0.36, which refuses to build on Python 3.12.
    "numba>=0.60",
    "mlflow>=2.17",
    "fredapi>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "matplotlib>=3.9",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.scripts]
riskos = "riskos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["riskos"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "duckdb.*", "optbinning.*", "lightgbm.*", "shap.*", "mlflow.*",
    "fredapi.*", "statsmodels.*", "sklearn.*", "matplotlib.*", "pandera.*",
    "scipy.*", "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["needs_data: requires Freddie Mac files under data/raw/"]
