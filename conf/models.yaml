# Phase 4 — challenger hyperparameters and the champion/challenger selection
# rubric (build plan §7.6).
#
# THIS FILE IS COMMITTED BEFORE THE COMPARISON RUNS. That ordering is the point,
# and it is verifiable in git history rather than merely asserted here: choosing
# the weights after seeing which model wins is not a selection rubric, it is a
# justification written backwards.
#
# At the time of writing, the scorecard's own out-of-time results are known
# (Phase 3), but no challenger has been fitted and no head-to-head exists. The
# weights below are taken from the build plan's stated priorities in §1 -
# "calibration, stability, and out-of-time behaviour matter more than AUC" -
# which were fixed before any modelling began.

candidate_pool:
  # Both models receive the SAME candidate features: everything that survives
  # leakage control, minus the high-cardinality identifiers. Each family then
  # applies its own appropriate selection - the scorecard does IV screening,
  # collinearity pruning and wrong-sign elimination; LightGBM handles weak and
  # correlated inputs natively through its own splitting.
  #
  # Handing the challenger only the scorecard's surviving 15 would rig the
  # comparison in the champion's favour.
  source: conf/features.yaml observation_features
  exclude: [postal_code, msa]

lightgbm:
  # Fixed, small, documented grid. No unbounded search (build plan §2, §7.6).
  # Six combinations, chosen to span underfit-to-overfit rather than to hunt for
  # a winner. The challenger is not tuned until it beats the champion.
  fixed_params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    n_estimators: 400
    learning_rate: 0.05
    min_child_samples: 200      # ~0.01% of the training panel; keeps leaves populated
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: -1
    verbose: -1
    seed: 20250901

  grid:
    num_leaves: [15, 31, 63]
    max_depth: [4, 6]

  early_stopping_rounds: 50

  # Monotone constraints where the direction is economically known, matching
  # the scorecard's constraints exactly so the two models are held to the same
  # economic assumptions. +1 = default probability increases with the feature,
  # -1 = decreases. LightGBM cannot constrain categorical features, so the
  # delinquency status is unconstrained here.
  monotone_constraints:
    credit_score: -1
    original_ltv: 1
    original_cltv: 1
    original_dti: 1
    original_interest_rate: 1

calibration:
  # Both candidates get both methods, fitted on the in-time validation split -
  # never on training (the model is already optimal there, so the mapping would
  # be the identity) and never on an out-of-time split (that would be fitting to
  # the data used to judge generalisation).
  methods: [isotonic, platt]
  fit_on: validation_in_time

selection:
  # Weights sum to 1.0. Derived from build plan §1's explicit ordering of what
  # this project must demonstrate, not from observed results.
  weights:
    calibration: 0.35
    stability: 0.25
    discrimination: 0.20
    explainability: 0.15
    latency: 0.05

  rationale:
    calibration: >-
      Highest weight. ECL is a money number: PD x LGD x EAD. A model that ranks
      borrowers perfectly but predicts 0.7% where 2.2% occurs understates the
      provision threefold, and that error flows directly to reported earnings.
      Build plan §1 states the thesis outright - a good classifier is not
      automatically a good risk model.
    stability: >-
      Second. A model whose score distribution shifts under regime change cannot
      be relied on between redevelopments, and IFRS 9 requires an estimate every
      reporting period, not once. Measured as score PSI on both out-of-time
      splits against the training reference.
    discrimination: >-
      Third, deliberately below calibration and stability. Ranking power is
      necessary but not sufficient, and it is the metric most likely to flatter
      a model that is unfit for provisioning.
    explainability: >-
      Material rather than decorative. OSFI E-23 expects model behaviour to be
      explicable, and a scorecard's points decomposition is exact while SHAP is
      an attribution to a reference. Scored on whether the mechanism reproduces
      the model output exactly and whether a non-technical reviewer can follow
      it.
    latency: >-
      Lowest. Both candidates score in microseconds per loan; this is included
      for completeness of the operational view, not because it discriminates.

  # How each dimension maps to a 0-1 score. Fixed here so the scoring cannot be
  # adjusted after the numbers are in.
  scoring:
    discrimination:
      metric: oot_stress_gini
      scale: [0.0, 1.0]         # Gini is already on 0-1
    calibration:
      metric: oot_stress_observed_over_expected
      # |log(ratio)| mapped to a score: a ratio of 1.0 scores 1.0, a ratio of
      # 3.0 or 1/3 scores 0.0. Symmetric in over- and under-prediction, because
      # both misstate the provision.
      transform: symmetric_log_ratio
      zero_score_at_ratio: 3.0
    stability:
      metric: max_oot_score_psi
      # PSI bands from conf/assumptions.yaml PSI_001: 0.10 stable, 0.25
      # significant. Score 1.0 at PSI 0, 0.0 at PSI 0.25.
      zero_score_at_psi: 0.25
    explainability:
      exact_decomposition_bonus: 1.0    # contributions reproduce the output exactly
      approximate_attribution: 0.6      # SHAP: additive but relative to a baseline
    latency:
      zero_score_at_microseconds_per_row: 100.0

  tie_breaker: >-
    If the weighted scores fall within 0.02, select the more explainable model.
    A near-tie on measured performance is not evidence of superiority, and
    explicability is the tiebreaker a model review would apply.
