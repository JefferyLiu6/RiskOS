# Findings register (build plan §7.12).
#
# Numbered findings raised against this project's own models and data, each with
# severity, description, impact, remediation, and owner. A review with no
# findings is not credible.
#
# Findings are recorded WHEN FOUND, not assembled at the end. A finding written
# up after the fact tends to be written to be survivable; one recorded at
# discovery is written as it actually was.
#
# Severity:
#   high    - materially affects a reported number or invalidates a conclusion
#   medium  - affects interpretation, or a defensible judgement a reviewer could
#             reasonably challenge
#   low     - documentation or robustness; no effect on reported figures

findings:
  - id: F-001
    title: COVID-19 payment forbearance contaminates the OOT-benign split
    severity: high
    phase_raised: 2
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      The locked default definition (§7.1) treats 90+ days past due as default.
      Under the CARES Act, borrowers entering COVID-19 payment forbearance were
      permitted to stop paying without an economic credit event. Those loans
      register as 90+ DPD in the performance data, so the definition classifies
      them as defaults.

    evidence: >-
      In 2020, 46,102 of 61,485 90+ DPD loan-months (75.0%) carry a
      borrower_assistance_status_code of 'F' (forbearance), against 3.9% in
      2019. Because a 2019 observation date has a forward window closing in
      2020, this propagates into the panel: 2,972 of 5,416 defaults in the
      oot_benign split (54.9%) occur in a month flagged as forbearance. The
      observed default rate rises from 0.41% at 2019Q1 to 3.83% at 2019Q4,
      exceeding the 2009Q1 financial-crisis peak of 3.17%.

    impact: >-
      The oot_benign split is specified as a benign-period contrast for
      stability testing. As built it is not benign: its measured default rate
      (1.010%) is inflated roughly 2.5x by a policy intervention rather than by
      credit deterioration. Any stability or calibration conclusion drawn from
      this split without conditioning on the flag would be wrong, and would most
      likely be misread as model degradation.

    remediation: >-
      A `default_in_forbearance` diagnostic column is now emitted on every panel
      row, derived from the borrower assistance status in the month the loan
      first met the default definition. All Phase 3 and Phase 4 metrics on
      oot_benign must be reported twice: as-is, and excluding forbearance-driven
      defaults. The locked definition itself is NOT amended - §7.1 forbids
      revising the target after seeing results, and the divergence here is
      between the definition's measurement and its economic intent, which is a
      finding to disclose rather than a bug to silently patch.

    residual_risk: >-
      Forbearance status is only populated from January 2014, so an equivalent
      correction cannot be applied to earlier periods. No comparable policy
      intervention affects 1999-2009, and the train and OOT-stress splits now
      show exactly zero forbearance-driven defaults, as they must.

    correction_2026_08_30: >-
      Figures in this finding were restated after defect R-001 (see below) was
      fixed. The original entry reported 3,255 forbearance defaults (60.1%) and
      non-zero counts in the pre-2014 splits, both artefacts of a look-ahead in
      the flag's derivation. Corrected: 2,972 (54.9%), and zero before 2014.

  - id: F-002
    title: Zero balance code 15 mapped to a credit event by inference, not transcription
    severity: medium
    phase_raised: 1
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      Build plan §7.1 lists "note sale" among the credit events constituting
      default. The User Guide, Release 47, labels the corresponding code (15)
      "Whole Loan sales". The mapping of code 15 to a credit event is therefore
      an inference about a renamed label, not a direct transcription.

    impact: >-
      Affects the target definition. Expected materiality is low: code 15 first
      appears in the data in 2014 and accounts for roughly 1,200 terminations
      across all vintages, and such loans are predominantly already seriously
      delinquent, so the 90+ DPD leg captures them independently.

    remediation: >-
      Quantify the incremental defaults attributable to code 15 alone, with the
      DPD leg held out, and record the figure in conf/assumptions.yaml. If
      material, report portfolio ECL both with and without it.

    residual_risk: "Low. Documented in conf/panel.yaml as whole_loan_sale_note."

  - id: F-003
    title: Loan-disjoint splits discard observations and reduce OOT sample size
    severity: medium
    phase_raised: 2
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      To satisfy the requirement that no loan crosses a split boundary, each
      loan is allocated to exactly one split and contributes only the
      observation dates falling inside that split's window. A loan allocated to
      oot_stress therefore contributes only its 2007-2009 rows; its 1999-2006
      rows are discarded.

    impact: >-
      The out-of-time splits are smaller than a date-only partition would give:
      oot_stress holds 342,603 rows from 42,133 loans and oot_benign 536,028
      rows from 49,550 loans, against 2,046,874 training rows. Confidence
      intervals on OOT metrics are correspondingly wider, which matters most for
      per-decile calibration where bin counts are already small.

    remediation: >-
      Accepted rather than remediated. The alternative - letting the same loan
      appear in both train and an out-of-time split - leaks loan-level
      information across the boundary and makes OOT performance look better than
      it is. Reliability curves must carry binomial confidence intervals so the
      reduced precision is visible rather than implicit.

    residual_risk: >-
      Acceptable. Sample sizes remain adequate for decile-level analysis;
      the constraint is recorded in conf/panel.yaml under loan_allocation.

  - id: F-004
    title: Delinquency status at the observation date dominates the scorecard
    severity: medium
    phase_raised: 3
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      current_loan_delinquency_status carries an Information Value of 1.6840,
      well above every other feature (credit_score is next at 1.1543) and above
      the 0.9 leakage tripwire. It was investigated and cleared as legitimate:
      it is contemporaneous information known at the observation date, and panel
      eligibility already excludes loans at 90+ DPD, so these are loans 30-89
      days late that have not yet defaulted. No forward information is used.

    impact: >-
      Legitimate but mechanically close to the target. A loan at 60-89 DPD needs
      only one further month of non-payment to satisfy the 90+ DPD definition,
      so the feature captures short-horizon payment momentum rather than
      underlying credit quality. Bins as ['00'] against ['01','02'] with event
      rates of 0.396% and 21.406%. It receives the largest scorecard
      coefficient (-0.778), so the model's apparent discrimination is
      substantially attributable to already-delinquent loans rather than to
      origination credit quality.

    remediation: >-
      Retained, because a 12-month IFRS 9 PD model is expected to condition on
      delinquency at the reporting date - the standard's own 30-DPD Stage 2
      backstop is exactly this information. However the scorecard must also be
      fitted and reported WITHOUT it, so the contribution of origination credit
      quality is visible separately, and so the Phase 5 staging logic is not
      circular. Not yet done.

    residual_risk: >-
      Medium until the without-delinquency variant is reported. The risk is
      interpretive rather than numerical: the model is not wrong, but its
      headline discrimination could be misattributed to underwriting quality.

  - id: F-005
    title: Scorecard materially under-predicts default under regime change
    severity: high
    phase_raised: 3
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      Calibration is sound in-period and fails out-of-period. The ratio of
      observed to expected default rate is 1.00 on train and 1.03 on in-time
      validation, but 3.21 on the 2007-2009 OOT-stress split: the model predicts
      0.68% where 2.17% was realised. Discrimination degrades far less over the
      same comparison, with Gini falling only from 0.787 to 0.638, retaining 81%
      of its power.

    impact: >-
      Directly material to ECL. Expected credit loss is PD x LGD x EAD, so a PD
      understated by a factor of 3.2 understates the provision by roughly the
      same factor before any macro overlay. A model selected on AUC alone would
      have looked acceptable throughout.

    remediation: >-
      Two mitigants, both planned rather than complete. First, the Phase 4
      calibration step (isotonic and Platt, fitted on in-time validation) must
      be evaluated on both OOT splits. Second, and more fundamentally, this is
      the gap the Phase 5 macroeconomic overlay exists to close: a
      point-in-time PD conditioned on unemployment and house prices is intended
      to move the predicted level with the cycle, which an unconditioned
      through-the-cycle model cannot do.

    residual_risk: >-
      Expected to remain material. A macro overlay fitted on 1999-2006 must
      extrapolate into the stress region, which is itself recorded as a
      limitation. The honest expectation is that the overlay reduces but does
      not eliminate the shortfall, and the backtest in Phase 5 will quantify
      what remains.

  - id: R-001
    title: Look-ahead in the forbearance flag caused by DuckDB arg_min null semantics
    severity: high
    phase_raised: 3
    date_raised: 2026-08-30
    status: remediated
    owner: project_author
    source: code review

    description: >-
      The `default_in_forbearance` diagnostic was derived with
      `arg_min(borrower_assistance_status_code, period) FILTER (WHERE
      is_default)`. DuckDB's arg_min ignores rows whose ranked VALUE is null, so
      when the first default month carried no assistance code the aggregate
      silently skipped forward and returned the code from a LATER default month.

    impact: >-
      A look-ahead of exactly the kind the §7.3 leakage controls exist to
      prevent, which the leakage tests could not catch because it occurred
      inside a diagnostic column rather than a feature. 1,600 loans were
      falsely flagged as forbearance-driven. The pre-2014 splits reported
      non-zero forbearance counts (train 103, oot_stress 163,
      validation_in_time 15) despite the assistance field not existing before
      January 2014 - an impossibility that should have been noticed and was not.
      Consequences: the F-001 share was overstated (60.1% against a true 54.9%),
      and the OOT-benign sensitivity was over-corrected, reporting an
      observed-over-expected ratio of 1.27 where the true figure is 1.43.

    remediation: >-
      The ranked value is now wrapped in a struct, which is never null, so the
      earliest default row always wins and a missing code correctly stays
      missing. All affected figures restated across the findings register, the
      assumptions register and the Phase 2 and 3 documentation. Regression
      tests in tests/test_review_regressions.py assert both the defect and the
      fix, and the zero-before-2014 invariant is now asserted in
      tests/test_panel.py.

    residual_risk: >-
      Low. The wider lesson is recorded: aggregate functions carry null
      semantics that can constitute look-ahead, and a value that is
      structurally impossible - a 2005 loan flagged with a field introduced in
      2014 - is the cheapest available signal that something is wrong.

  - id: R-002
    title: CSI was blind to changes in missingness
    severity: medium
    phase_raised: 3
    date_raised: 2026-08-30
    status: remediated
    owner: project_author
    source: code review

    description: >-
      Numeric CSI dropped nulls from both reference and actual before binning,
      and categorical CSI omitted nulls from both the level set and the
      denominator. A feature whose null rate moved from 50% to 0% therefore
      returned a CSI of exactly 0.0.

    impact: >-
      Directly contradicted the project's own stated principle that a meaningful
      absence is information, and would have hidden a real and severe form of
      drift in Phase 6 monitoring: a data feed that starts or stops populating a
      field is among the most common causes of silent model failure in
      production.

    remediation: >-
      Both paths now carry an explicit `__missing__` bin, with the denominator
      taken over the full population on each side so a shift in the null rate
      registers as drift. Verified to still return exactly 0.0 for a feature
      compared against itself, so no drift is manufactured where none exists.

    residual_risk: "Low."

  - id: R-003
    title: Principal-driver explanations depended on the scoring batch
    severity: medium
    phase_raised: 3
    date_raised: 2026-08-30
    status: remediated
    owner: project_author
    source: code review

    description: >-
      `Scorecard.principal_drivers` centred each row's points contributions on
      the mean of the batch supplied to it. A borrower scored alone reported
      every driver as exactly 0.0, and the same borrower scored alongside
      different peers received a different explanation.

    impact: >-
      Would have surfaced directly in the Phase 6 API, where /score receives a
      single loan and returns its principal drivers. An explanation that varies
      with who else happened to be in the request is not an explanation of the
      borrower, and could not be defended to an adjudicator or a validator.

    remediation: >-
      Contributions are now centred on the mean points vector of the TRAINING
      population, captured at fit time and stored with the model. Regression
      tests assert a single-row explanation is non-trivial and identical across
      three different batch compositions.

    residual_risk: "Low."

  - id: R-004
    title: CLI logging flags had no effect
    severity: low
    phase_raised: 3
    date_raised: 2026-08-30
    status: remediated
    owner: project_author
    source: code review

    description: >-
      Logging was configured at module import, before CLI options were parsed,
      and a configure-once guard then discarded the later call. `--verbose` and
      `--json-logs` silently did nothing. Two further layers compounded it:
      structlog's logger caching bound module-level loggers to the import-time
      configuration, and `get_logger` re-applied the defaults on every call,
      reverting any explicit choice.

    impact: >-
      Operational only, with no effect on any reported figure. It would have
      mattered in Phase 6, where structured JSON logs are the intended
      production output.

    remediation: >-
      configure() now reconfigures when settings genuinely change, logger
      caching is disabled, and get_logger applies defaults only when nothing has
      been configured. Both flags verified end to end.

    residual_risk: "None."

  - id: F-006
    title: Both PD candidates fail the calibration dimension under stress
    severity: high
    phase_raised: 4
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      The champion/challenger comparison selected LightGBM on a pre-committed
      rubric, but both candidates score approximately zero on calibration, the
      most heavily weighted dimension. On the 2007-2009 OOT-stress split the
      observed-over-expected default rate is 2.80 for LightGBM and 3.21 for the
      scorecard. The rubric selected the less-bad of two models that both fail
      the criterion that matters most for expected credit loss.

    evidence: >-
      Recalibration does not close the gap. Isotonic and Platt, both fitted on
      the in-time validation split, move OOT-stress O/E only from 2.80 to 2.75
      and 2.76 for LightGBM, and from 3.21 to 3.11 and 3.03 for the scorecard.
      Both methods are monotone, so AUC, Gini and KS are unchanged to three
      decimal places, as they must be.

    impact: >-
      Material and direct. ECL is PD x LGD x EAD, so a PD understated by a
      factor of roughly three understates the provision by the same factor
      before any overlay. Critically, the score PSI on OOT-stress is 0.0004 for
      LightGBM and 0.0019 for the scorecard - both firmly "stable". A monitoring
      programme watching only score distribution would have raised nothing at
      all while the model under-predicted defaults threefold.

    remediation: >-
      Not remediable by recalibration, and this is the correct result rather
      than a defect in the calibration step. A mapping estimated on a period
      whose default rate is 0.68% cannot know the level will triple in a period
      it never saw. Recalibration corrects a level that is systematically wrong
      on data you have; it cannot correct a level that is wrong because the
      economy changed. The Phase 5 point-in-time macroeconomic overlay is the
      intended remediation, and this finding is the evidence that it is
      necessary rather than decorative. Phase 6 monitoring must track
      calibration drift and observed-versus-predicted default rate, not score
      PSI alone.

    residual_risk: >-
      Expected to remain material after the overlay. The macro model must be
      estimated on 1999-2006 and therefore extrapolates into the stress region.
      The honest expectation is that the overlay reduces but does not eliminate
      the shortfall; the Phase 5 backtest will quantify what remains.

  - id: F-007
    title: The selection rubric measured the wrong proxy for explainability
    severity: low
    phase_raised: 4
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      The pre-committed rubric scored explainability as 1.0 for an "exact
      decomposition" and 0.6 for "approximate attribution", with the scorecard
      assigned 1.0 and SHAP 0.6 a priori. Measurement contradicts the
      assignment: maximum reconstruction error is 1.14e-13 for scorecard points
      against the score, and 1.15e-14 for SHAP values plus base value against
      the log-odds margin. TreeSHAP is exact for tree ensembles, not
      approximate.

    impact: >-
      Low. The rule as written was applied unchanged, because rewriting a
      pre-committed rubric after seeing results defeats the purpose of
      committing it. The sensitivity was reported instead: equalising
      explainability at 1.0 gives LightGBM 0.4635 against the scorecard's
      0.3648, so the selection is unchanged and the margin widens from 0.0387
      to 0.0987. The decision is robust to the error.

    remediation: >-
      Restate the dimension for the next review cycle to measure what it
      actually intended. The genuine distinction is not exactness but that
      scorecard points are absolute, denominated in a human-readable unit, and
      enumerable in advance, while SHAP values are relative to a population
      baseline, expressed in log-odds, and computed per borrower. Both are
      additive and both are exact. A revised rule must be committed before the
      next comparison, not adjusted during this one.

    residual_risk: >-
      None for this decision. The lesson is that a pre-committed rule can be
      committed and still be wrong, and that the discipline is to apply it as
      written and report the sensitivity rather than to amend it retroactively.

  - id: F-008
    title: Lifetime PD beyond 96 months is extrapolated, not fitted
    severity: high
    phase_raised: 5
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      The hazard model is fitted on the 1999-2006 window to match the direct
      12-month model (assumption HAZ_003). No loan in that window exceeds about
      96 months of age, so the two oldest age bands (96-144 months and 144+) are
      empty and inestimable. They are dropped from the design matrix, which
      would otherwise be singular. The fitted baseline covers five bands, with
      hazard ratios of 2.84, 3.88, 5.06, 5.75 and 4.03 against the 0-6 month
      reference, reproducing the empirical seasoning peak at 36-60 months.

    impact: >-
      Lifetime ECL for a 25-year mortgage requires a hazard path out to 300
      months. Beyond 96 months the path is an extrapolation of the oldest
      estimable band, not a fitted quantity. Since stage 2 and stage 3 loans are
      measured on lifetime ECL, this affects the provision for exactly the
      population where the provision is largest.

    remediation: >-
      Two options, neither yet implemented. Either fit the baseline on the full
      1999-2026 risk set to estimate the old-age bands and accept the period
      mismatch for the baseline only, holding covariates to the training window;
      or report lifetime ECL under an explicit range of terminal-hazard
      assumptions. The second is preferred because it makes the uncertainty
      visible rather than resolving it by assumption. Until then, lifetime ECL
      figures must carry this limitation.

    residual_risk: >-
      Material. The empirical hazard on the full risk set declines after 60
      months, so holding the oldest estimable band flat is likely conservative,
      but "likely conservative" is not a substitute for an estimate.

  - id: F-009
    title: The macro overlay under-predicts the crisis by half, and the reason is structural
    severity: high
    phase_raised: 5
    date_raised: 2026-08-30
    status: open
    owner: project_author

    description: >-
      The overlay was estimated on 1999Q1-2006Q4 and then fed the REALISED
      2008-2009 macro path. It predicts quarterly default rates of 0.92% to
      1.66% against realised rates of 1.81% to 3.17%. The mean ratio of observed
      to predicted is 2.04.

    evidence: >-
      The cause is identified rather than assumed. Year-on-year HPI change in
      the estimation sample ranges from +1.74% to +16.98% - the sample contains
      no house-price decline at all, while 2008-2009 realised -18.62% to -5.25%.
      The fitted HPI coefficient is -0.01934 on the pre-2007 window against
      -0.04237 on the full 1999-2019 history, a factor of 2.19. Re-running the
      same backtest with the full-history coefficient gives a ratio of 1.07.
      The 2.19x coefficient gap accounts almost exactly for the 2.04x shortfall.
      Note the 1.07 figure is NOT an out-of-sample validation: the full-history
      fit includes 2008-2009, so it is in-sample by construction. The comparison
      isolates the mechanism, it does not vindicate the model.
      Separately, unemployment is not statistically significant in either
      window: +0.1195 with a Newey-West 95% interval of [-0.0085, +0.2475]
      pre-2007, and +0.1159 with [-0.0390, +0.2708] on full history. The sign is
      economically correct in both, but the coefficient is not distinguishable
      from zero on 24 serially-correlated quarterly observations.

    impact: >-
      The overlay reduces but does not close the gap identified in F-006. The
      un-overlaid scorecard understated the crisis default rate by a factor of
      3.21; the overlay leaves a factor of about 2.04. This is a partial
      remediation and must not be presented as a solution. It also means the
      severe-stress scenario, at 10% unemployment and -20% HPI, is an
      extrapolation well outside anything the estimation sample contains -
      flagged as such in reports/figures/macro_scenario_shifts.csv.

    remediation: >-
      No estimation technique recovers a sensitivity the sample does not
      contain. The honest options are to report the full-history fit alongside
      the pre-2007 fit as an upper bound on sensitivity, which is done; to
      propagate the HAC intervals into scenario ECL as a range, which is done;
      and to state plainly that a stress overlay calibrated on benign data will
      under-predict stress. The scenario ECL band for severe stress is $60.48M
      to $333.75M against a point estimate of $143.10M - a factor of 5.5 from
      end to end, which is the correct representation of what is known.

    residual_risk: >-
      High and irreducible with this estimation sample. This is the central
      methodological limitation of the project and belongs in the executive
      summary of the validation report, not only in this register.

  - id: F-010
    title: The end-to-end ECL run uses a portfolio-constant PD, degenerating the SICR sensitivity
    severity: medium
    phase_raised: 5
    date_raised: 2026-08-30
    status: remediated
    owner: project_author

    description: >-
      The demonstration ECL run applies the portfolio-average 12-month and
      lifetime PD from the hazard term structure to every loan, rather than a
      per-loan hazard path. Origination-vintage PD is approximated as 0.6 times
      the lifetime PD. The SICR ratio is therefore identical for every loan
      (1.667), so the stage-2 population is either the entire portfolio at
      thresholds below 1.667 or only the 30-DPD backstop population above it.

    evidence: >-
      reports/figures/ecl_staging_sensitivity.csv reports stage-2 counts of
      112,266 at a threshold of 1.5 and exactly 1,524 at 2.0, 2.5, 3.0 and 4.0.
      A genuine sensitivity would vary smoothly. The 1,524 loans are entirely
      the delinquency backstop, not the ratio test.

    impact: >-
      The reported portfolio ECL of $44.23M on $15.91B of exposure (0.278%
      coverage) is directionally reasonable but is not loan-sensitive, and the
      ECL_001 sensitivity test is presently vacuous.
      CORRECTION 2026-08-31: this entry originally asserted that staging order,
      discounting and the PD x LGD x EAD arithmetic were unit-tested. That was
      FALSE when written - no test imported riskos.ecl at all. The claim was
      identified in code review and is retained here rather than deleted,
      because a false assurance in a governance artifact is a more serious
      defect than the missing test it concealed. Twenty tests now cover the
      engine, the competing-risk accounting and the macro overlay
      (tests/test_ecl_and_hazard.py); see R-008.

    remediation: >-
      Project the fitted hazard per loan across its own remaining term, using
      each loan's covariates and age path, and derive a per-loan lifetime PD and
      an origination-vintage PD from the same model. The projection machinery
      already exists in train_hazard.project_12m_pd and needs extending to the
      full remaining term.

    residual_risk: >-
      Resolved 2026-08-31. `hazard.project_paths` now projects every loan
      through the fitted hazards using its own covariates, its own age path and
      its own remaining term, with the origination-vintage PD projected for the
      same loan from age zero over its original term. Per-loan PD now varies
      substantially: the 12-month PD runs from 0.048% at the 5th percentile to
      1.404% at the 95th, a spread of roughly 29x, against a single constant
      before.
      Closing this exposed a deeper conceptual issue, raised separately as
      F-011: the staging sensitivity is still flat, but now for a reason that is
      a property of the model rather than of the scaffold.

  - id: R-005
    title: Hazard imputation used the scoring batch median rather than the fitting median
    severity: high
    phase_raised: 5
    date_raised: 2026-08-31
    status: remediated
    owner: project_author
    source: code review

    description: >-
      The hazard design matrix imputed missing covariates with the median of
      whatever batch was being scored. Standardisation moments were already
      carried with the model; the imputation medians were not. A row with a
      missing credit score therefore imputed to NaN when scored alone, because
      a single-row batch has no median, and to the batch median otherwise.

    impact: >-
      The same borrower received a different covariate value depending on who
      else was in the request, and scored alone received NaN, which propagates
      silently through the cloglog link into a NaN hazard and then into a NaN
      PD. This is the same defect class as R-003 in a different module, which
      is the more useful observation: the fix for R-003 was applied where it was
      found rather than looked for elsewhere.

    remediation: >-
      Medians are captured on the fitting sample BEFORE imputation and travel
      with the model in the Standardisation record alongside the means and
      standard deviations. Verified that a missing covariate now yields an
      identical finite value whether scored alone or in a batch.

    residual_risk: >-
      Low for this module. The general lesson is recorded: any statistic
      computed from the data at prediction time is a batch dependency, and the
      audit should be across all modules rather than per finding.

  - id: R-006
    title: Competing-risk convention was unstated and asymmetric
    severity: medium
    phase_raised: 5
    date_raised: 2026-08-31
    status: remediated
    owner: project_author
    source: code review

    description: >-
      Review reported that the competing-risk arithmetic was internally
      inconsistent, on the grounds that event increments exceed the reduction in
      survival by the cross-product of the two hazards.

    assessment: >-
      The specific claim does not hold, and the check is recorded here so the
      disagreement is auditable. The implementation credits default with
      alive * h_default and never computes a prepayment increment of
      alive * h_prepay. Under the sequential convention it implicitly used -
      default resolved before prepayment - the outcome probabilities are
      P(default) = h_d, P(prepay) = (1 - h_d) * h_p and
      P(neither) = (1 - h_d) * (1 - h_p), which sum to exactly 1. Verified
      numerically at exaggerated hazards over 200 periods: 0.168066 + 0.831929
      + 0.000005 = 1.000000000.
      The review nevertheless identified a real defect. The convention was
      unstated, and it is asymmetric: the entire joint mass h_d * h_p is
      attributed to default rather than shared.

    remediation: >-
      The convention is now named, documented and selectable. `default_first`
      remains the default and is the conservative choice; `symmetric` splits the
      joint mass in proportion to the two hazards and yields 0.84% lower
      lifetime PD at exaggerated hazards. A `competing_risk_accounting` helper
      asserts the probabilities close to 1, and that assertion is now a
      parametrised test.

    residual_risk: "Low. The difference between conventions is under 1%."

  - id: R-007
    title: Phase 5 was reported as substantially done while unreachable from the CLI
    severity: high
    phase_raised: 5
    date_raised: 2026-08-31
    status: remediated
    owner: project_author
    source: code review

    description: >-
      The hazard, LGD, macro and ECL modules were written and exercised through
      ad-hoc scripts, but `riskos evaluate`, `riskos hazard` and `riskos ecl`
      still raised "not yet built". `make all` could not complete. The README
      nonetheless described Phase 5 as substantially done.

    impact: >-
      A reproducibility failure and an overstatement. Results existed only as
      artefacts produced by commands not present in the repository, which is
      precisely the condition that makes a model unauditable.

    remediation: >-
      A `riskos.ecl.run` orchestration module now performs the full sequence -
      LGD, staging, base ECL, staging sensitivity, macro fit, scenario ECL and
      the 2008-2009 backtest - and all three commands are wired. Status language
